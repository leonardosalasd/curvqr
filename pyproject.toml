[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curvqr"
dynamic = ["version"]
authors = [
    { name = "Leonardo Salas", email = "leonardo.salas01@outlook.com" }
]
description = "A beautiful, fast Python CLI that creates custom QR codes from URLs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]
keywords = [
    "cli",
    "command-line",
    "generator",
    "graphics",
    "qr",
    "qr-code",
    "terminal",
    "url",
]

[project.urls]
Homepage = "https://github.com/leonardosalasd/curvqr"
Repository = "https://github.com/leonardosalasd/curvqr"
Issues = "https://github.com/leonardosalasd/curvqr/issues"

[project.scripts]
curvqr = "curvqr.cli:main"

[tool.hatch.version]
path = "curvqr/project_data.py"